name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: ./cli/graph git lint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

      - name: Lint pushed commit
        if: github.event_name == 'push'
        run: ./cli/graph git lint --last

      - name: Lint
        run: pnpm exec biome lint src sandbox test cli package.json biome.json tsconfig.json tsconfig.test.json *.config.ts commitlint.config.cjs

      - name: Typecheck
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsc -p tsconfig.test.json --noEmit

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: |
          pnpm exec tsdown
          pnpm exec tsdown --config tsdown.standalone.config.ts

      - name: Validate package version
        run: ./cli/graph git version-check

      # Repository audits and agent scaffolds are being restructured separately.
      # Package gates above run explicitly; prepack would repeat scaffold checks.
      - name: Verify npm payload
        run: npm pack --dry-run --ignore-scripts

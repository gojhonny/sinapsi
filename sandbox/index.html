<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sinapsi</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0b0c;
        color: #f5f5f5;
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
      }

      main {
        display: grid;
        gap: 1.25rem;
        min-height: 100vh;
        padding: 1.25rem 1.25rem 2rem;
        justify-items: center;
        align-content: center;
      }

      sinap-si {
        width: min(86vmin, 44rem);
        height: min(86vmin, 44rem);
      }

      label {
        display: grid;
        gap: 0.25rem;
        color: #a1a1aa;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }

      #event-log {
        width: min(86vmin, 44rem);
        min-height: 5.5rem;
        margin: 0;
        padding: 0.75rem 1rem;
        border: 1px solid #27272a;
        border-radius: 0.5rem;
        color: #d4d4d8;
        background: #18181b;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <sinap-si id="graph" move="rotate" speed="1" aria-label="Semantic drift graph"></sinap-si>
      <p>Hover the graph to freeze motion. Hover a node for one-level neighbors; click to activate.</p>
      <pre id="event-log">Hover or click a node to echo its payload.</pre>
      <div class="controls">
        <label>
          move
          <select id="move">
            <option value="idle">idle</option>
            <option value="rotate" selected>rotate</option>
            <option value="pulse">pulse</option>
          </select>
        </label>
        <label>
          speed
          <input id="speed" type="range" min="0.1" max="10" step="0.1" value="1" />
        </label>
      </div>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
